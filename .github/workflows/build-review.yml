name: Build review

# The maintainer's re-verification of an outside contributor's pull request (CONTRIBUTING.md).
# Started by hand only, by someone with write access, with the head SHA they reviewed. It runs
# develop's copy of this file, the harness and tools/verify_pr.py; the pull request's op/ files
# are copied in as text and compiled, and nothing from the pull request is run.
on:
  workflow_dispatch:
    inputs:
      pr:
        description: "Pull request number"
        required: true
      sha:
        description: "The full head SHA you reviewed"
        required: true

permissions:
  contents: read
  issues: read
  pull-requests: write
  statuses: write
  actions: write

# One build review at a time on the runner; a running one is never cancelled.
concurrency:
  group: build-review
  cancel-in-progress: false

jobs:
  build-review:
    runs-on: [self-hosted, sfcop-mac]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: develop
          fetch-depth: 0
          # The compiler reads the contributor's source: no token is left in .git/config.
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          compiler: native

      - name: Re-verify with develop's harness
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr }}
          SHA: ${{ inputs.sha }}
          # As the check job: the native compiler, the image staying the compiler of record.
          # verify_pr.py sets HARNESS_NO_CACHE=1 and runs each step under nice -n 5.
          HARNESS_COMPILER: native
        run: |
          set -u
          printf '%s' "$PR" | grep -Eqx '[0-9]+' || { echo "pr must be a number"; exit 2; }
          printf '%s' "$SHA" | grep -Eqx '[0-9a-f]{40}' || { echo "sha must be 40 hex digits"; exit 2; }
          report="$RUNNER_TEMP/build-review.md"
          rc=0
          python3 -I tools/verify_pr.py "$PR" --sha "$SHA" --report "$report" || rc=$?
          [ -f "$report" ] || printf 'Build review of #%s refused or failed before the build (exit %s); see the run log.\n' "$PR" "$rc" > "$report"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          echo "report=$report" >> "$GITHUB_OUTPUT"

      - name: Post the report and the status
        if: always() && steps.verify.outputs.report != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr }}
          SHA: ${{ inputs.sha }}
          RC: ${{ steps.verify.outputs.rc }}
          REPORT: ${{ steps.verify.outputs.report }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -eu
          case "$RC" in
            0) state=success; text="rebuilt with develop's harness: nothing regressed" ;;
            1) state=failure; text="rebuilt with develop's harness: a step failed or a function regressed" ;;
            3) state=failure; text="refused: head moved or the guard failed" ;;
            *) state=error; text="the build review could not run" ;;
          esac
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file "$REPORT"
          gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" -f state="$state" \
            -f context=build-review -f description="$text" -f target_url="$RUN_URL" >/dev/null
          if [ "$RC" = 0 ] || [ "$RC" = 1 ]; then
            gh workflow run claude-code-review.yml --repo "$GITHUB_REPOSITORY" --ref develop -f pr="$PR"
          fi
          [ "$RC" = 0 ]
