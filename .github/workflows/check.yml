name: Check

# The definition of done, with the retail files and the native compiler, on the owner's machine.
# It never runs on a pull request event: a pull request runs the workflow files of its own merge
# commit, so a fork could rewrite this file and run commands on the owner's machine. A push to a
# branch of this repository runs the file as it is on that branch, and only someone with write
# access can push. Commits on a pull request's head carry this run's status, so a pull request
# from a branch of this repository shows `check` as before. A fork's pull request never runs
# here, not even by hand: this job runs the checked-out commit's own scripts. The hand start is
# for a commit on a branch of this repository, and the first step refuses any other. A fork's
# work is judged by a build that uses develop's harness and only the fork's source files.
#
# `develop` and `main` are left out: everything reaches them through a pull request whose branch
# has already passed, and a squash-merge adds no code that run has not seen.
on:
  push:
    branches-ignore: [main, develop]
  workflow_dispatch:
    inputs:
      ref:
        description: A commit SHA or a branch name to check
        required: true
        type: string

permissions:
  contents: read

# A new push to a branch replaces the run of the previous one.
concurrency:
  group: check-${{ inputs.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: [self-hosted, sfcop-mac]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref || github.sha }}
          # The whole history: scripts/check.sh holds the branch to its merge base with
          # origin/develop, and there is no merge commit on a push to find it in.
          fetch-depth: 0

      # Before any script of the checked-out commit runs: a hand-started ref must be on a branch
      # of this repository. A fork's commit can be fetched by its SHA, but no branch here holds it.
      - name: Refuse a commit that is not on a branch of this repository
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ -z "$(git branch -r --contains HEAD)" ]; then
            echo "error: $(git rev-parse HEAD) is on no branch of this repository; check does not run it" >&2
            exit 1
          fi

      - uses: ./.github/actions/setup
        with:
          compiler: native

      - name: The definition of done
        env:
          # The tests job of the pull request workflow runs them on every pull request.
          CHECK_SKIP_TESTS: "1"
          # The runner is a Mac with the native compiler installed (the setup step checks it).
          # The image stays the compiler of record through the scheduled Docker audit.
          HARNESS_COMPILER: native
          # Every unit compiled and every function scored afresh: no cached build or score
          # stands in CI's result (harness/README.md, "Caches").
          HARNESS_NO_CACHE: "1"
        run: nice -n 5 sh scripts/check.sh
