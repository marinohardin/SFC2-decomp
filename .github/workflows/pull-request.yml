name: Pull request

on:
  pull_request:
    branches: [main, develop, "feature/**"]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

# A new push to a pull request replaces the run of the previous one.
concurrency:
  group: pull-request-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Every pull request, a fork's included: the Python tests, on a hosted runner. They need no
  # retail file; the steps that do skip with a reason.
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python3 -m pip install --quiet pytest==8.3.3
      - run: python3 -m pytest tests harness/tests -q
