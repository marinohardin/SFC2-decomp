name: Pull request

on:
  pull_request:
    branches: [main, develop, "feature/**"]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

# A new push to a pull request replaces the run of the previous one.
concurrency:
  group: pull-request-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Every pull request, a fork's included: the Python tests, on a hosted runner. They need no
  # retail file; the steps that do skip with a reason.
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python3 -m pip install --quiet pytest==8.3.3
      - run: python3 -m pytest tests harness/tests -q

  # The definition of done, with the retail files and the native compiler, on the owner's machine.
  # Only for branches of this repository: a fork's pull request never runs code on it.
  check:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, sfcop-mac]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The checkout is the merge of the pull request into its base. Its first parent is
          # the base, so two commits are enough to list what the pull request changes.
          fetch-depth: 2

      - uses: ./.github/actions/setup
        with:
          compiler: native

      - name: The definition of done
        env:
          # The tests job above has run them on every pull request.
          CHECK_SKIP_TESTS: "1"
          # The runner is a Mac with the native compiler installed (the setup step checks it).
          # The image stays the compiler of record through the scheduled Docker audit.
          HARNESS_COMPILER: native
          # Every unit compiled and every function scored afresh: no cached build or score
          # stands in CI's result (harness/README.md, "Caches").
          HARNESS_NO_CACHE: "1"
        run: nice -n 5 sh scripts/check.sh
