name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

# One review at a time per pull request. A running review is not cancelled by a new push: the
# push may only merge the base branch, and then it is not reviewed again (see "Decide").
concurrency:
  group: claude-code-review-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude-review:
    # Draft pull requests are not reviewed. Marking one ready starts the review.
    # Not for a fork's pull request: it gets no secrets, and its code never runs with them.
    # Not for a grind landing (a `grind/` lane or an `integrate/` batch): its diff is decompiled
    # functions, which the verifier judges byte for byte in `check`, and is too large to read whole.
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !startsWith(github.head_ref, 'grind/') &&
      !startsWith(github.head_ref, 'integrate/')
    # Reads the pull request through gh only: a hosted runner, so it never waits behind a build.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      # A push is reviewed again only when it changes the pull request's own change. Merging the
      # base branch, or regenerating the matched set or the manifest, leaves the pull request's
      # diff against the base as it was, and is not reviewed again. Opening, reopening and
      # marking ready always review. When in doubt (the previous head is gone), review. The diff is
      # compared without context lines, so rows the base adds next to the pull request's do not count.
      - name: Decide whether this push needs a review
        id: decide
        env:
          EVENT: ${{ github.event.action }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.pull_request.head.sha }}
          BASE: origin/${{ github.event.pull_request.base.ref }}
        run: |
          own_change() {
            git diff -U0 "$(git merge-base "$BASE" "$1")" "$1" -- . \
              ':!analysis/results/matched_set.json' ':!op/manifest.tsv' | git patch-id --stable | cut -d' ' -f1
          }
          review=true
          if [ "$EVENT" = synchronize ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            if [ "$(own_change "$BEFORE")" = "$(own_change "$AFTER")" ]; then
              review=false
              echo "The push leaves the pull request's own change as it was: no new review."
            fi
          fi
          echo "review=$review" >> "$GITHUB_OUTPUT"

      - name: Run Claude Code Review
        id: claude-review
        if: steps.decide.outputs.review == 'true'
        uses: anthropics/claude-code-action@cc98b3ae241b0fcfb6a42a2690751afffecb4452 # v1.0.278
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: |
            Review pull request ${{ github.repository }}/pull/${{ github.event.pull_request.number }}.

            Read the "When reviewing a pull request" section of AGENTS.md and follow it, then review the change in depth:
            - Read the whole diff with `gh pr diff`. Do not filter it with grep and do not truncate it with head; test files are part of the review.
            - Open the changed files and the code they call, and check the change against docs/DESIGN.md and docs/CONVENTIONS.md where they apply.
            - Post the whole review as one comment with `gh pr comment`, and post nothing else: no inline comments and no second comment. Every comment is an email to the owner.
            - In that comment, list what you read and checked, then the findings by severity (high, medium, low). Give each finding its place as `path:line` and say what is wrong and why. If there are none, say plainly that you found no blocking issues. Never post a bare "No issues found".
          # --max-turns caps what a single review can spend.
          claude_args: '--allowedTools "Read,Grep,Glob,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*)" --max-turns 40'
